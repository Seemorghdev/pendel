[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pendel"
version = "0.1.0"
description = "English tech jobs at companies within commuting reach, from public recruiting-system feeds."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["duckdb>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
